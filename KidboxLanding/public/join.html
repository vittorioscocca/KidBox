<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invito famiglia · KidBox</title>
  <!--
    Pagina mostrata SOLO quando l'app non è installata: se KidBox c'è, iOS e
    Android aprono direttamente l'app tramite Universal Link / App Link e questa
    pagina non viene mai caricata.

    Nota sul segreto dell'invito: viaggia nel FRAMMENTO dell'URL (dopo #), che i
    browser non inviano mai al server. Né questa pagina né i log di hosting lo
    vedono, e nemmeno i bot che generano le anteprime dei link in WhatsApp,
    iMessage o nelle email. Per questo il frammento non viene toccato in alcun
    modo qui dentro.
  -->
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f2f0eb;
      color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121212; color: #f5f5f5; }
      .card { background: #1e1e1e !important; }
      .muted { color: #a0a0a0 !important; }
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }
    .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
    .muted { color: #666; font-size: 13px; }
    .stores { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn {
      display: block;
      padding: 14px 20px;
      border-radius: 14px;
      background: #ff6b00;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }
    .btn.secondary { background: transparent; color: #ff6b00; border: 1.5px solid #ff6b00; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon.png" alt="KidBox" class="logo">
    <h1>Sei stato invitato in una famiglia</h1>
    <p>Per accettare l'invito ti serve l'app KidBox su questo dispositivo.</p>

    <div class="stores">
      <a class="btn" href="https://apps.apple.com/app/apple-store/id6761055375">Scarica per iPhone</a>
      <a class="btn secondary" href="https://play.google.com/store/apps/details?id=it.vittorioscocca.kidbox">Scarica per Android</a>
    </div>

    <p class="muted">
      Dopo aver installato l'app, torna qui e riapri il link che hai ricevuto:
      l'invito si aprirà direttamente in KidBox.
    </p>
  </div>
</body>
</html>
